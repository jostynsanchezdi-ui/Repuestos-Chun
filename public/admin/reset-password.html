<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repuestos Chun — Nueva Contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-card__header">
      <span class="login-card__icono">🔑</span>
      <h1 class="login-card__titulo">Nueva contraseña</h1>
      <p class="login-card__subtitulo">Repuestos Chun — Admin</p>
    </div>

    <div id="estado-verificando" style="text-align:center; padding: 1rem 0; color: var(--color-texto-sec);">
      Verificando enlace...
    </div>

    <form class="login-form oculto" id="reset-form" novalidate>
      <div class="campo-grupo">
        <label class="campo-label" for="nueva-password">Nueva contraseña</label>
        <input
          class="campo-input"
          type="password"
          id="nueva-password"
          placeholder="Mínimo 6 caracteres"
          required
          autocomplete="new-password"
        />
      </div>
      <div class="campo-grupo">
        <label class="campo-label" for="confirmar-password">Confirmar contraseña</label>
        <input
          class="campo-input"
          type="password"
          id="confirmar-password"
          placeholder="Repite la contraseña"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="alerta alerta--error oculto" id="reset-error"></div>
      <div class="alerta alerta--exito oculto" id="reset-exito"></div>

      <button class="btn-primario btn-primario--bloque" type="submit" id="btn-reset">
        Guardar nueva contraseña
      </button>
    </form>

    <div class="alerta alerta--error oculto" id="error-token" style="margin-top:1rem"></div>

    <a href="/admin/" class="login-card__volver" style="margin-top:1.5rem; display:block; text-align:center">← Volver al login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL      = 'https://cbredsjpfrcqmjwizhif.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Skb4lgbOKw2IIkgOPw_vGQ_5bTwC6TM';

    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const estadoEl   = document.getElementById('estado-verificando');
    const formEl     = document.getElementById('reset-form');
    const errorToken = document.getElementById('error-token');

    // Supabase envía el token como fragment (#access_token=...&type=recovery)
    // El SDK lo detecta automáticamente al llamar getSession()
    (async () => {
      const { data: { session }, error } = await cliente.auth.getSession();

      if (error || !session) {
        estadoEl.classList.add('oculto');
        errorToken.textContent = 'Enlace inválido o expirado. Solicita un nuevo link de recuperación.';
        errorToken.classList.remove('oculto');
        return;
      }

      estadoEl.classList.add('oculto');
      formEl.classList.remove('oculto');
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevaPass     = document.getElementById('nueva-password').value;
      const confirmarPass = document.getElementById('confirmar-password').value;
      const errorEl       = document.getElementById('reset-error');
      const exitoEl       = document.getElementById('reset-exito');
      const btnEl         = document.getElementById('btn-reset');

      errorEl.classList.add('oculto');
      exitoEl.classList.add('oculto');

      if (nuevaPass.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        errorEl.classList.remove('oculto');
        return;
      }
      if (nuevaPass !== confirmarPass) {
        errorEl.textContent = 'Las contraseñas no coinciden.';
        errorEl.classList.remove('oculto');
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = 'Guardando...';

      const { error } = await cliente.auth.updateUser({ password: nuevaPass });

      if (error) {
        errorEl.textContent = `Error: ${error.message}`;
        errorEl.classList.remove('oculto');
        btnEl.disabled = false;
        btnEl.textContent = 'Guardar nueva contraseña';
        return;
      }

      exitoEl.textContent = '¡Contraseña actualizada! Redirigiendo al login...';
      exitoEl.classList.remove('oculto');
      formEl.querySelectorAll('input, button').forEach(el => el.disabled = true);

      setTimeout(() => { window.location.href = '/admin/'; }, 2000);
    });
  </script>
</body>
</html>
