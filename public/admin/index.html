<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repuestos Chun — Acceso Administrador</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-card__header">
      <span class="login-card__icono">⚙️</span>
      <h1 class="login-card__titulo">Repuestos Chun</h1>
      <p class="login-card__subtitulo">Panel de Administración</p>
    </div>

    <form class="login-form" id="login-form" novalidate>

      <div class="campo-grupo">
        <label class="campo-label" for="email">Correo electrónico</label>
        <input
          class="campo-input"
          type="email"
          id="email"
          name="email"
          placeholder="admin@correo.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="campo-grupo">
        <label class="campo-label" for="password">Contraseña</label>
        <input
          class="campo-input"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="alerta alerta--error oculto" id="alerta-error"></div>

      <button class="btn-primario btn-primario--bloque" type="submit" id="btn-login">
        Ingresar
      </button>

    </form>

    <a href="/" class="login-card__volver">← Ver catálogo público</a>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/auth.js"></script>
</body>
</html>
